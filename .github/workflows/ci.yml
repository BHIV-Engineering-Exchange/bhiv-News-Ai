name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  test-task2:
    name: Run Task2 unit tests
    runs-on: ubuntu-latest
    outputs:
      result: ${{ job.status }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f "News-Ai-main/requirements.txt" ]; then pip install -r News-Ai-main/requirements.txt || true; fi
          pip install pytest requests

      - name: Run unit tests (News-Ai-main)
        working-directory: News-Ai-main
        run: |
          python -m pytest tests -q

  test-unified-backend:
    name: Run unified_tools_backend tests (allowed to fail)
    runs-on: ubuntu-latest
    needs: test-task2
    outputs:
      result: ${{ job.status }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          if [ -f "News-ai-master/unified_tools_backend/requirements.txt" ]; then pip install -r News-ai-master/unified_tools_backend/requirements.txt || true; fi
          pip install pytest requests httpx

      - name: Run backend tests (allowed failure)
        working-directory: News-ai-master/unified_tools_backend
        continue-on-error: true
        run: |
          python -m pytest tests -q || true

  notify:
    name: Notify (Slack if configured)
    runs-on: ubuntu-latest
    needs: [test-task2, test-unified-backend]
    if: always()
    steps:
      - name: Send Slack notification if configured
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          if [ -z "$SLACK_WEBHOOK" ]; then echo "No SLACK_WEBHOOK set, skipping"; exit 0; fi
          TASK2_RES="${{ needs.test-task2.result }}"
          UNIFIED_RES="${{ needs.test-unified-backend.result }}"
          MSG="CI results - Task2: $TASK2_RES; Unified: $UNIFIED_RES - Repo: $GITHUB_REPOSITORY - Ref: $GITHUB_REF"
          PAYLOAD=$(printf '{"text":"%s"}' "$MSG")
          curl -s -X POST -H 'Content-type: application/json' --data "$PAYLOAD" "$SLACK_WEBHOOK"
