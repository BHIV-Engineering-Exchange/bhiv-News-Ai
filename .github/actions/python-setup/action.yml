name: "Setup Python and install dependencies"
description: "Sets up Python and installs dependencies from an optional requirements file and extra packages"
inputs:
  python-version:
    description: "Python version to setup"
    required: false
    default: "3.11"
  requirements:
    description: "Path to a requirements.txt file to install (optional)"
    required: false
    default: ""
  extra-packages:
    description: "Space-separated list of extra packages to install (optional)"
    required: false
    default: "pytest requests"
runs:
  using: "composite"
  steps:
    - name: Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ inputs.python-version }}

    - name: Upgrade pip
      shell: bash
      run: python -m pip install --upgrade pip

    - name: Install requirements (if provided and exists)
      if: ${{ inputs.requirements != '' }}
      shell: bash
      run: |
        if [ -f "${{ inputs.requirements }}" ]; then
          pip install -r "${{ inputs.requirements }}" || true
        else
          echo "Requirements file not found: ${{ inputs.requirements }} (skipping)"
        fi

    - name: Install extra packages (if any)
      if: ${{ inputs.extra-packages != '' }}
      shell: bash
      run: |
        pip install ${{ inputs.extra-packages }}
