services:
  # Backend API Service
  - type: web
    name: news-ai-backend
    runtime: python
    region: oregon
    plan: free
    branch: main
    rootDir: unified_tools_backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ENABLE_OPENAI
        value: "0"
      - key: ENABLE_GROK
        value: "0"
      - key: OLLAMA_BASE_URL
        fromSecret: OLLAMA_BASE_URL
      - key: OLLAMA_MODEL
        value: "llama3.1"
      - key: BLACKHOLE_LLM_URL
        fromSecret: BLACKHOLE_LLM_URL
      - key: BLACKHOLE_LLM_MODEL
        value: "llama3.1"
    healthCheckPath: /health

  # Frontend Service
  - type: web
    name: news-ai-frontend
    runtime: node
    region: oregon
    plan: free
    branch: main
    rootDir: blackhole-frontend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: NEXT_PUBLIC_ENV
        value: production
