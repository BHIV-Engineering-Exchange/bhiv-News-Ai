services:
  # Backend API Service
  - type: web
    name: news-ai-backend
    runtime: python
    region: oregon
    plan: free
    branch: main
    rootDir: unified_tools_backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: MONGODB_URL
        fromSecret: MONGODB_URL
      - key: ENABLE_OPENAI
        value: "0"
      - key: ENABLE_GROK
        value: "0"
      - key: OLLAMA_BASE_URL
        fromSecret: OLLAMA_BASE_URL
      - key: OLLAMA_MODEL
        value: "llama3.1"
      - key: BLACKHOLE_LLM_URL
        fromSecret: BLACKHOLE_LLM_URL
      - key: BLACKHOLE_LLM_MODEL
        value: "llama3.1"
    healthCheckPath: /health

  # Frontend Service
  - type: web
    name: news-ai-frontend
    runtime: node
    region: oregon
    plan: free
    branch: main
    rootDir: blackhole-frontend
    buildCommand: npm ci --include=dev && npx prisma@6.19.2 generate --schema=prisma/schema.prisma && next build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: NEXT_PUBLIC_ENV
        value: production
      - key: DATABASE_URL
        fromSecret: DATABASE_URL
      - key: NEXT_PUBLIC_NOOPUR_API_BASE
        fromSecret: NEXT_PUBLIC_NOOPUR_API_BASE
      - key: NEXT_PUBLIC_SANKALP_API_BASE
        fromSecret: NEXT_PUBLIC_SANKALP_API_BASE
      - key: NEXT_PUBLIC_API_URL
        value: "https://news-ai-backend.onrender.com"
